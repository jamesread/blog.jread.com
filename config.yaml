baseURL: 'https://blog.jread.com/'
languageCode: 'en-gb'
author: "James Read"
copyright: "James Read"
title: "James Read's Code, Containers & Cloud blog"
theme: 'jwr'

outputs:
  home:
    - html
    - rss
  section:
    - html
    - rss
  taxonomy:
    - html
  term:
    - html

params:
  favicon: logo.png
  logo: "logo.png"
  author: "James Read"
  githubuser: "jamesread"
  description: "James Read's Code, Containers & Cloud blog"
  title: "James Read's Code, Containers & Cloud blog"
  useFeaturedImage: true
  images:
    - "/socialSharePreview.jpg"
  social:
    twitter: "@jamesreadtweets"
    bluesky: "@jamesread.bsky.social"
    mastodon: "jamesread"
  # Reusable frontmatter keys for AI-assisted articles (see partials/ai-disclosure.html):
  #   ai_assisted: "review-only" | "mostly-generative-writing"   # omit or empty = no AI used
  #   ai_assisted_model: "Composer 2.5 Fast"                     # optional model name
  # Site params per level: disclosure, disclosure_emphasis, disclosure_suffix
  ai_assisted:
    heading: "AI disclosure"
    model_label: "Model"
    none:
      disclosure: "This article was written by the author, "
      disclosure_emphasis: "*without* using AI for creation or review."
      disclosure_suffix: ""
    review-only:
      disclosure: "This article was written by the author and "
      disclosure_emphasis: "reviewed with AI assistance."
      disclosure_suffix: ""
    mostly-generative-writing:
      disclosure: "This article was "
      disclosure_emphasis: "most authored with AI, it was refined over several different prompts"
      disclosure_suffix: ", and finally was human-reviewed by James."

menu:
  main:
    - name: 'Home'
      pageRef: '/'
      weight: 1

    - name: 'Code'
      pageRef: '/tags/code'
      weight: 2

    - name: 'Containers'
      pageRef: '/tags/containers'
      weight: 3

    - name: 'Cloud'
      pageRef: '/tags/cloud'
      weight: 4

    - name: 'All Tags'
      pageRef: '/tags/'
      weight: 5

    - name: "James' Homepage"
      pageRef: 'http://jread.com'
      weight: 6
      params:
        class: last

pagination:
  pageSize: 10

markup:
  goldmark:
    renderer:
      unsafe: true
